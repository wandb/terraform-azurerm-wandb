apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cert-issuer
  namespace: {{ .Release.Namespace }}
spec:
  acme:
    # External ACME directory used for certificate issuance. Let's Encrypt
    # production issues publicly trusted certificates; staging is for testing.
    server: {{ .Values.acmeServer }}
    email: {{ .Values.acmeEmail }}
    # This secret contains the ACME account key, not the W&B TLS private key.
    privateKeySecretRef:
      name: {{ .Values.privateKeySecretRef }}
    # Let's Encrypt reaches the public hostname on port 80. AGIC routes the
    # temporary solver ingress through Azure Application Gateway.
    solvers:
    - http01:
        ingress:
          class: {{ .Values.ingressClass }}
